[project]
name = "librecad-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server and prompt bar for controlling LibreCAD by natural language"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "librecad", "cad", "dxf", "claude", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcp>=1.2.0",
  "pywin32>=306; sys_platform == 'win32'",
  "pillow>=10.0",
  "ezdxf>=1.3",
  "pywinauto>=0.6.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
librecad-mcp = "librecad_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librecad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
